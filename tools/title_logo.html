<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@700&family=Cormorant+Garamond:wght@500&display=swap" rel="stylesheet">
<style>
:root{--color-text:#f5f3fa;--color-accent:#a68cf0;--color-narration:#d4cfe0}
html,body{margin:0;background:transparent}
#wrap{display:inline-block;padding:28px 40px;text-align:center}
.game-logo{position:relative;display:inline-block;margin:0;font-family:'Noto Serif JP',serif;font-size:4.6rem;font-weight:700;letter-spacing:.18em;line-height:1}
.game-logo-ghost{position:absolute;top:0;left:0;width:100%;color:transparent}
.game-logo-ghost.cyan{color:#6fa8d8;opacity:.5;transform:translate(-2px,-2px)}
.game-logo-ghost.magenta{color:#d86fa0;opacity:.45;transform:translate(2px,2px)}
.game-logo-main{position:relative;display:inline-block;color:var(--color-text);text-shadow:0 0 24px rgba(138,111,216,.5);clip-path:polygon(0 0,100% 0,100% 22%,0 22%,0 22%,3px 22%,3px 30%,0 30%,0 100%,100% 100%,100% 30%,3px 30%)}
.divider{width:260px;height:1px;background:var(--color-accent);opacity:.5;margin:1rem auto .8rem auto}
.sub{color:var(--color-narration);letter-spacing:.35em;font-family:'Cormorant Garamond',serif;font-size:1.1rem;font-weight:500}
</style></head><body>
<div id="wrap"><h1 class="game-logo"><span class="game-logo-ghost cyan">不在証明</span><span class="game-logo-ghost magenta">不在証明</span><span class="game-logo-main">不在証明</span></h1>
<div class="divider"></div><div class="sub">ALIBI — Action Part</div></div></body></html>
